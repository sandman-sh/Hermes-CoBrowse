name: hermes-cobrowse
repo: https://github.com/sandman-sh/Hermes-CoBrowse
sha: main
subdir: ''
tier: community
category: desktop
requires_hermes: ">=0.22.0"
version: "1.0.0"
title: "Hermes CoBrowse"
description: "Real-time multi-window spatial co-browsing canvas and interactive human-in-the-loop web automation for Hermes Agent and Desktop with low-latency CDP screencasting, dynamic window orchestration, and 2FA handoff."
readme: true
platforms: []
capabilities:
  provides_tools:
    - cobrowse_open
    - cobrowse_navigate
    - cobrowse_get_state
    - cobrowse_click
    - cobrowse_type
    - cobrowse_request_handoff
    - cobrowse_scroll
    - cobrowse_eval_js
    - cobrowse_close
  provides_hooks:
    - post_tool_call
  provides_middleware: []
requires_env: []
